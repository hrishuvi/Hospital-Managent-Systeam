services:
  server:
    build: ./server
    container_name: hms-api
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - CLIENT_URL=http://localhost:5173
      - JWT_SECRET=replace-with-a-long-random-secret

  client:
    build: ./client
    container_name: hms-client
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:5000/api
    depends_on:
      - server
